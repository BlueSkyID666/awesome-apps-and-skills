name: Suggest a resource
description: Suggest a skill, repo, app or website
labels: [suggestion]
body:
  - type: input
    id: url
    attributes: { label: URL }
    validations: { required: true }
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [skill, mcp-server, plugin, app, starter, library, guide, website, web-tool, newsletter, video-channel]
    validations: { required: true }
  - type: input
    id: category
    attributes: { label: Category (e.g. coding, writing-and-editing) }
  - type: textarea
    id: why
    attributes: { label: Why is it useful? }
    validations: { required: true }
